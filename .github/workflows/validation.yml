name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Run portable validation suite
        run: dotnet run --project HollywoodFX.Validation/HollywoodFX.Validation.csproj --configuration Release
